    <path d="M26 13 C26 9, 29 8, 31 10 C29 11, 28 12, 26 14" stroke="#214A35" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M26 13 C26 9, 23 8, 21 10 C23 11, 24 12, 26 14" stroke="#214A35" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="26" cy="7" r="1.2" fill="#C9A45C"/>
  </g>

  <!-- Typography: Dulce Esencia -->
  <text x="68" y="34" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="#7B2638" letter-spacing="-0.02em">
    Dulce Esencia
  </text>
  
  <!-- Subtitle: PAN DE PASCUA CASERO -->
  <text x="70" y="49" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#214A35" letter-spacing="0.22em">
    PAN DE PASCUA CASERO
  </text>
  
  <!-- Decorative small star accent -->
  <path d="M228 30 L229.2 32.5 L232 33 L229.8 34.8 L230.5 37.5 L228 36 L225.5 37.5 L226.2 34.8 L224 33 L226.8 32.5 Z" fill="#C9A45C" opacity="0.85"/>
