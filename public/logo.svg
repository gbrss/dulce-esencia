<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Symbol / Emblem on the left -->
  <g transform="translate(4, 6)">
    <!-- Base circle badge with warm cream and soft gold border -->
    <circle cx="26" cy="26" r="24" fill="#FFF8EC" stroke="#C9A45C" stroke-width="1.5"/>
    
    <!-- Stylized Pan de Pascua loaf -->
    <path d="M14 31 C14 20, 18 15, 26 15 C34 15, 38 20, 38 31 C38 36, 35 37, 26 37 C17 37, 14 36, 14 31 Z" fill="#7B2638" />
    
    <!-- Warm crust texture and nuts decoration -->
    <ellipse cx="26" cy="22" rx="3.5" ry="2" fill="#C9A45C"/>
    <ellipse cx="20" cy="25" rx="2" ry="1.5" fill="#FFF8EC"/>
    <ellipse cx="32" cy="25" rx="2" ry="1.5" fill="#FFF8EC"/>
    <path d="M18 29 C22 27, 25 30, 28 27 C31 30, 33 28, 35 29" stroke="#C9A45C" stroke-width="1.2" stroke-linecap="round"/>
    
